[project]
name = "python-testing-guide-demo"
version = "0.2.0"
description = "Progressive Python testing tutorial: from one function to a layered API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9"]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6",
  "pytest-cov>=5",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["e2e: black-box test against a running server (requires TEST_BASE_URL)"]
