[project]
name = "python-testing-guide-demo"
version = "0.1.0"
description = "Runnable companion for a problem-driven Python testing guide"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
